name: book_store_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  flutter_riverpod: ^3.2.1
  modal_progress_hud_nsn: ^0.5.1
  connectivity_plus: ^6.0.3
  internet_connection_checker: ^1.0.0+1
  dio: ^5.9.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
      - assets/images/

flutter_native_splash:
  color: "#ffffff"           # The background color of the splash screen
  image: assets/images/logo.png      # Path to your existing logo
  
  android_12:
    image: assets/images/logo.png
    color: "#ffffff"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon.png"
  min_sdk_android: 21 # ensures compatibility with your sdk version