name: book_store_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4
  flutter_riverpod: ^3.2.1

flutter:
  uses-material-design: true

  assets:
      - assets/images/

flutter_native_splash:
  color: "#ffffff"           # The background color of the splash screen
  image: assets/images/logo.png      # Path to your existing logo
  
  android_12:
    image: assets/images/logo.png
    color: "#ffffff"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon.png"
  min_sdk_android: 21 # ensures compatibility with your sdk version